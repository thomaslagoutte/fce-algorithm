name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package (with dev extras)
        run: pip install -e ".[dev]"

      - name: Run mypy
        run: mypy src/fourierlearn/

      - name: Run pytest (includes the CI import guard, FR-014/FR-015)
        run: pytest tests/ -v
